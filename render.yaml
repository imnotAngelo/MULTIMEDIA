services:
  - type: web
    name: multimedia-learning-backend
    runtime: node
    region: ohio
    plan: standard
    buildCommand: cd backend && npm ci && npm run build
    startCommand: cd backend && npx tsx src/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
      - key: FRONTEND_URL
        value: https://multimedia-learning.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: SUPABASE_URL
        value: https://ciopmrwvmgqsbapyljih.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "3600"
      - key: JWT_REFRESH_EXPIRATION
        value: "86400"
